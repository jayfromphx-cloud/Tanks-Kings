# trigger rebuild
# Tanks & Kings — iOS release pipeline (Codemagic)
#
# What this does on every push to main/master:
#   1. npm install
#   2. npx cap sync ios
#   3. Fetches/creates App Store signing cert + provisioning profile
#      via your App Store Connect API key (automatic code signing)
#   4. Archives with Xcode (26+ / iOS 26 SDK per Apple's 2026-04-28 minimum)
#   5. Uploads the .ipa to TestFlight
#
# ONE-TIME SETUP (Codemagic web UI, ~5 min):
#   a) codemagic.io -> "Continue with GitHub" -> Add application -> pick this repo
#   b) In the app: Teams & integrations -> Developer Portal / App Store Connect
#      API -> add key: Issuer ID + Key ID + the .p8 file
#      (Apple Developer portal -> Users and Access -> Integrations ->
#       App Store Connect API -> Team Keys -> +)
#      This powers BOTH code signing (fetch-signing-files --create) and the
#      TestFlight upload below. No manual certificates needed.
#   c) Apple Developer portal: make sure the App ID for
#      com.tanksandkings.app exists, and the app record exists in
#      App Store Connect.
#
# Docs: https://docs.codemagic.io/yaml-quick-start/building-an-ios-app/

workflows:
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - revenuecat
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.tanksandkings.app"
      xcode: latest # Apple requires Xcode 26+ / iOS 26 SDK since 2026-04-28
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    integrations:
      app_store_connect: Codemagic
    scripts:
      - name: Install node dependencies
        script: |
          npm install
      - name: Inject RevenueCat key
        script: |
          # TK_REVENUECAT_KEY is set as an encrypted environment variable
          # in the Codemagic UI (never committed to the repo).
          if [ -z "$TK_REVENUECAT_KEY" ]; then
            echo "TK_REVENUECAT_KEY not set — RevenueCat billing will fall back to demo mode"
          else
            sed -i '' "s|<script src=\"tk-native-bridge.js\">|<script>window.__TK_REVENUECAT_KEY=\"$TK_REVENUECAT_KEY\";</script><script src=\"tk-native-bridge.js\">|" www/index.html
            echo "RevenueCat key injected"
          fi
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Sync App ID capabilities (iCloud)
        script: |
          # STRICT STEP — aborts loudly in seconds if anything here is wrong.
          # The app legitimately uses iCloud key-value storage (TKiCloudSync,
          # via com.apple.developer.ubiquity-kvstore-identifier in
          # App.entitlements), so the App Store provisioning profile MUST carry
          # the iCloud capability or the Xcode archive dies at code signing.
          # NOTE: there is deliberately NO auto-enable attempt below. Two fixes
          # died on it: first an argparse bug, then Apple's own API rejecting
          # iCloud enablement (409: CloudKitVersion of 'null' is invalid) — and
          # the app-store-connect CLI cannot send the required ICLOUD_VERSION
          # setting at all. Enabling iCloud is a ONE-TIME manual toggle in the
          # Developer Portal; it stays on permanently. This step asserts it and
          # fails fast with exact instructions if it is off.
          set -e
          IDS_JSON=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json)
          BID=$(printf '%s' "$IDS_JSON" | python3 -c "import json,sys; ids=[b['id'] for b in json.load(sys.stdin)]; print(ids[0] if ids else '')")
          [ -n "$BID" ] || { echo "FATAL: Bundle ID $BUNDLE_ID not found in the Developer Portal."; exit 1; }
          echo "Bundle ID resource: $BID"
          CAPS_JSON=$(app-store-connect bundle-ids capabilities "$BID" --json)
          printf '%s' "$CAPS_JSON" | grep -q '"ICLOUD"' || {
            echo "FATAL: iCloud capability is NOT enabled on $BUNDLE_ID."
            echo "One-time manual fix (~30s, permanent): developer.apple.com > Certificates, Identifiers & Profiles > Identifiers > $BUNDLE_ID > check iCloud > Save — then rebuild."
            exit 1
          }
          echo "OK: iCloud capability confirmed on $BUNDLE_ID."
          PROFILES_JSON=$(app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --json)
          PIDS=$(printf '%s' "$PROFILES_JSON" | python3 -c "import json,sys; print(' '.join(p['id'] for p in json.load(sys.stdin)))")
          for PID in $PIDS; do
            echo "Deleting stale App Store profile $PID (next step regenerates it WITH iCloud)"
            app-store-connect profiles delete "$PID"
          done
          REMAINING=$(app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --json | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          [ "$REMAINING" -eq 0 ] || { echo "FATAL: $REMAINING stale App Store profile(s) still exist for $BUNDLE_ID; --create would reuse them."; exit 1; }
          echo "OK: no stale App Store profiles remain; fetch-signing-files --create regenerates one with iCloud next."
      - name: Fetch App Store signing files
        script: |
          # Creates the distribution certificate + App Store provisioning
          # profile automatically on first run via the ASC API key.
          # The persistent signing key MUST be set in Codemagic as a Secure
          # variable named CERTIFICATE_PRIVATE_KEY (group 'revenuecat').
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is empty or not set."
            echo "Add it in Codemagic > your app > Environment variables,"
            echo "group 'revenuecat', Secure ON, full PEM including BEGIN/END lines."
            exit 1
          fi
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" > /tmp/tk_dist_key.pem
          chmod 600 /tmp/tk_dist_key.pem
          if ! head -1 /tmp/tk_dist_key.pem | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is malformed — first line must be -----BEGIN RSA PRIVATE KEY-----"
            echo "Re-paste the full key from tk-distribution-key.pem (Secure ON)."
            exit 1
          fi
          mkdir -p /tmp/tk_signing
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key "@file:/tmp/tk_dist_key.pem" --certificates-dir /tmp/tk_signing --create
          rm -f /tmp/tk_dist_key.pem
          echo "Signing files saved:"
          ls -la /tmp/tk_signing/
      - name: Verify provisioning profile carries iCloud
        script: |
          # FAIL-FAST: decode the profile(s) fetch-signing-files just produced
          # and PROVE one for com.tanksandkings.app carries the iCloud
          # key-value-store entitlement. Without this, a stale profile wastes
          # a full ~10-minute Xcode archive before dying at
          # GatherProvisioningInputs with a cryptic exit 65.
          set -e
          python3 - <<'PYEOF_VERIFY'
          import glob, os, plistlib, subprocess, sys
          d = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          files = sorted(glob.glob(os.path.join(d, "*.mobileprovision")))
          print(f"profiles on disk: {len(files)} in {d}")
          ok = False
          for f in files:
              raw = subprocess.run(["security", "cms", "-D", "-i", f], capture_output=True).stdout
              try:
                  pl = plistlib.loads(raw)
              except Exception as e:
                  print(f"  SKIP (undecodable): {f}: {e}")
                  continue
              ents = pl.get("Entitlements", {}) or {}
              appid = ents.get("application-identifier", "")
              kv = "com.apple.developer.ubiquity-kvstore-identifier" in ents
              print(f"  - {pl.get('Name')} | UUID={pl.get('UUID')} | appid={appid} | iCloud-kvstore={kv}")
              if "com.tanksandkings.app" in appid and kv:
                  ok = True
          if not ok:
              print("FATAL: no provisioning profile for com.tanksandkings.app carries the iCloud key-value-store entitlement.")
              print("The App ID capability change did not make it into a regenerated profile — inspect the 'Sync App ID capabilities' step output above.")
              sys.exit(1)
          print("OK: App Store profile carries the iCloud entitlement; archive may proceed.")
          PYEOF_VERIFY
      - name: Add certificates to keychain
        script: |
          keychain add-certificates --certificate "/tmp/tk_signing/*.p12"
      - name: Set up code signing settings on Xcode project
        script: |
          # Applies the fetched provisioning profiles to the Xcode project and
          # generates ~/export_options.plist, which build-ipa requires.
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build signed IPA
        script: |
          # NOTE: we deliberately do NOT use `xcode-project build-ipa` here.
          # That wrapper swallows xcodebuild's output and prints only a
          # 12-line summary, which made "exit code 65" undiagnosable twice.
          # These explicit xcodebuild calls tee the FULL log to files and
          # print the actual error lines on failure.
          set -o pipefail
          ARCHIVE_PATH="$HOME/build/ios/xcarchive/App.xcarchive"
          IPA_DIR="build/ios/ipa"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$IPA_DIR"
          echo "=== xcodebuild archive (full log: $HOME/xcodebuild-archive.log) ==="
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            archive 2>&1 | tee "$HOME/xcodebuild-archive.log"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== ARCHIVE FAILED — likely error lines ==="
            grep -aiE "error:|ERROR|failed|no .*provisioning|provisioning profile|code sign|signing certificate|bundle id|entitlement" "$HOME/xcodebuild-archive.log" | head -50
            echo "=== last 40 lines of archive log ==="
            tail -40 "$HOME/xcodebuild-archive.log"
            exit 1
          fi
          echo "=== xcodebuild -exportArchive (full log: $HOME/xcodebuild-export.log) ==="
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist "$HOME/export_options.plist" 2>&1 | tee "$HOME/xcodebuild-export.log"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== EXPORT FAILED ==="
            tail -40 "$HOME/xcodebuild-export.log"
            exit 1
          fi
          echo "IPA built:"
          ls -la "$IPA_DIR"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration # uses the API key added in the Codemagic UI
        submit_to_testflight: true
