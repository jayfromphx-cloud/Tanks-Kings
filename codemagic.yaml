# trigger rebuild
# Tanks & Kings — iOS release pipeline (Codemagic)
#
# What this does on every push to main/master:
#   1. npm ci
#   2. npx cap sync ios
#   3. Fetches/creates App Store signing cert + provisioning profile
#      via your App Store Connect API key (automatic code signing)
#   4. Archives with Xcode (26+ / iOS 26 SDK per Apple's 2026-04-28 minimum)
#   5. Uploads the .ipa to TestFlight
#
# ONE-TIME SETUP (Codemagic web UI, ~5 min):
#   a) codemagic.io -> "Continue with GitHub" -> Add application -> pick this repo
#   b) In the app: Teams & integrations -> Developer Portal / App Store Connect
#      API -> add key: Issuer ID + Key ID + the .p8 file
#      (Apple Developer portal -> Users and Access -> Integrations ->
#       App Store Connect API -> Team Keys -> +)
#      This powers BOTH code signing (fetch-signing-files --create) and the
#      TestFlight upload below. No manual certificates needed.
#   c) Apple Developer portal: make sure the App ID for
#      com.tanksandkings.app exists, and the app record exists in
#      App Store Connect.
#
# Docs: https://docs.codemagic.io/yaml-quick-start/building-an-ios-app/

workflows:
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - revenuecat
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.tanksandkings.app"
      xcode: latest # Apple requires Xcode 26+ / iOS 26 SDK since 2026-04-28
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    integrations:
      app_store_connect: Codemagic
    scripts:
      - name: Install node dependencies
        script: |
          npm install
      - name: Inject RevenueCat key
        script: |
          # TK_REVENUECAT_KEY is set as an encrypted environment variable
          # in the Codemagic UI (never committed to the repo).
          if [ -z "$TK_REVENUECAT_KEY" ]; then
            echo "TK_REVENUECAT_KEY not set — RevenueCat billing will fall back to demo mode"
          else
            sed -i '' "s|<script src=\"tk-native-bridge.js\">|<script>window.__TK_REVENUECAT_KEY=\"$TK_REVENUECAT_KEY\";</script><script src=\"tk-native-bridge.js\">|" www/index.html
            echo "RevenueCat key injected"
          fi
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Sync App ID capabilities (iCloud)
        script: |
          # The app uses iCloud key-value storage (TKiCloudSync via
          # com.apple.developer.ubiquity-kvstore-identifier in App.entitlements).
          # If the App ID lacks the iCloud capability, the generated provisioning
          # profile won't carry the entitlement and the Xcode archive fails at
          # code signing. This step enables it automatically and drops stale
          # profiles so fetch-signing-files --create regenerates them WITH it.
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json 2>/dev/null | python3 -c "import json,sys; ids=[b['id'] for b in json.load(sys.stdin)]; print(ids[0] if ids else '')")
          if [ -z "$BID" ]; then
            echo "Bundle ID $BUNDLE_ID not found, skipping capability sync"
            exit 0
          fi
          echo "Bundle ID resource: $BID"
          app-store-connect bundle-ids enable-capabilities --capability iCloud "$BID" || true
          echo "Enabled capabilities:"
          app-store-connect bundle-ids capabilities "$BID" || true
          for PID in $(app-store-connect bundle-ids profiles --bundle-ids "$BID" --type IOS_APP_STORE --json 2>/dev/null | python3 -c "import json,sys; print(' '.join(p['id'] for p in json.load(sys.stdin)))"); do
            echo "Deleting stale App Store profile $PID (will be regenerated with iCloud)"
            app-store-connect profiles delete "$PID" || true
          done
      - name: Fetch App Store signing files
        script: |
          # Creates the distribution certificate + App Store provisioning
          # profile automatically on first run via the ASC API key.
          # The persistent signing key MUST be set in Codemagic as a Secure
          # variable named CERTIFICATE_PRIVATE_KEY (group 'revenuecat').
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is empty or not set."
            echo "Add it in Codemagic > your app > Environment variables,"
            echo "group 'revenuecat', Secure ON, full PEM including BEGIN/END lines."
            exit 1
          fi
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" > /tmp/tk_dist_key.pem
          chmod 600 /tmp/tk_dist_key.pem
          if ! head -1 /tmp/tk_dist_key.pem | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is malformed — first line must be -----BEGIN RSA PRIVATE KEY-----"
            echo "Re-paste the full key from tk-distribution-key.pem (Secure ON)."
            exit 1
          fi
          mkdir -p /tmp/tk_signing
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key "@file:/tmp/tk_dist_key.pem" --certificates-dir /tmp/tk_signing --create
          rm -f /tmp/tk_dist_key.pem
          echo "Signing files saved:"
          ls -la /tmp/tk_signing/
      - name: Add certificates to keychain
        script: |
          keychain add-certificates --certificate "/tmp/tk_signing/*.p12"
      - name: Set up code signing settings on Xcode project
        script: |
          # Applies the fetched provisioning profiles to the Xcode project and
          # generates ~/export_options.plist, which build-ipa requires.
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build signed IPA
        script: |
          # NOTE: we deliberately do NOT use `xcode-project build-ipa` here.
          # That wrapper swallows xcodebuild's output and prints only a
          # 12-line summary, which made "exit code 65" undiagnosable twice.
          # These explicit xcodebuild calls tee the FULL log to files and
          # print the actual error lines on failure.
          set -o pipefail
          ARCHIVE_PATH="$HOME/build/ios/xcarchive/App.xcarchive"
          IPA_DIR="build/ios/ipa"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$IPA_DIR"
          echo "=== xcodebuild archive (full log: $HOME/xcodebuild-archive.log) ==="
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            archive 2>&1 | tee "$HOME/xcodebuild-archive.log"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== ARCHIVE FAILED — likely error lines ==="
            grep -aiE "error:|ERROR|failed|no .*provisioning|provisioning profile|code sign|signing certificate|bundle id|entitlement" "$HOME/xcodebuild-archive.log" | head -50
            echo "=== last 40 lines of archive log ==="
            tail -40 "$HOME/xcodebuild-archive.log"
            exit 1
          fi
          echo "=== xcodebuild -exportArchive (full log: $HOME/xcodebuild-export.log) ==="
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist "$HOME/export_options.plist" 2>&1 | tee "$HOME/xcodebuild-export.log"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== EXPORT FAILED ==="
            tail -40 "$HOME/xcodebuild-export.log"
            exit 1
          fi
          echo "IPA built:"
          ls -la "$IPA_DIR"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration # uses the API key added in the Codemagic UI
        submit_to_testflight: true
